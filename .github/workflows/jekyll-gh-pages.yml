name: Deploy Frontend to Pages & Verify Backend

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # 1. Frontend Build Job
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: chatapp-frontend-master/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: chatapp-frontend-master
        run: npm ci

      - name: Build Frontend (Vite)
        working-directory: chatapp-frontend-master
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Vite outputs production files to the 'dist' directory by default
      - name: Upload Frontend Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: chatapp-frontend-master/dist

  # 2. Backend Verification Job (Continuous Integration)
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: chatapp-server-master/package-lock.json

      - name: Install Backend Dependencies
        working-directory: chatapp-server-master
        run: npm ci

      # Optional: Add any build or test scripts for your backend here
      # - name: Run Backend Tests
      #   working-directory: chatapp-server-master
      #   run: npm test

  # 3. Frontend Deployment Job
  deploy-frontend:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-frontend
    steps:
      - name: Deploy Frontend to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
